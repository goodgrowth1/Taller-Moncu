<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:A;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif}
.abs{position:absolute}
.t{color:#FFFFFF;text-align:center;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.55)}
#title{left:40px;right:40px;top:250px;font-size:120px;line-height:1.04;z-index:20}
#title i{font-style:normal;color:#E5F38B}#title b{font-weight:400;color:#7B5CF0}
#title em{font-style:normal;display:inline-block;background:#E5F38B;color:#000;text-shadow:none;padding:4px 26px 10px;border-radius:20px}
#title small{display:block;font-size:84px;line-height:1.08;margin-top:22px}
#chip{left:0;right:0;top:95px;text-align:center;z-index:21}
#chip span{display:inline-block;background:rgba(255,255,255,.06);color:#FFFFFF;font-family:A;font-size:44px;letter-spacing:4px;padding:8px 30px 10px;border:3px solid rgba(255,255,255,.25);border-radius:999px}
#teaser{left:0;right:0;top:860px;display:flex;justify-content:center;gap:40px;z-index:19}
#teaser span{width:140px;height:140px;border-radius:50%;background:#7B5CF0;color:#FFF;line-height:140px;font-size:110px;text-align:center;font-family:A;opacity:0}
#card{left:80px;right:80px;top:700px;height:400px;z-index:19;background:#141414;border:3px solid #2c2840;border-radius:40px;box-shadow:0 30px 60px rgba(0,0,0,.45);opacity:0}
#num{left:44px;top:44px;width:140px;height:140px;border-radius:50%;background:#7B5CF0;color:#FFF;font-size:96px;line-height:140px;text-align:center;text-shadow:none}
#ctext{left:220px;right:40px;top:40px;color:#FFFFFF;font-size:80px;line-height:1.05}
#cnote{left:44px;right:44px;top:250px;color:#A3A3A3;font-family:P;font-size:46px;line-height:1.3}
#cnote b{color:#E5F38B}
#mono{left:250px;top:1110px;width:580px;height:580px;z-index:10;transform-origin:50% 95%}
#mono img{position:absolute;left:0;top:0;width:580px;height:580px;display:none}
#prize{left:0;right:0;top:230px;z-index:22;text-align:center;opacity:0}
#prize img{width:320px;height:auto;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}
#pnum{font-size:210px;line-height:1;color:#7B5CF0;margin-top:10px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#plab{font-size:110px;line-height:1;color:#E5F38B;letter-spacing:6px;margin-top:-6px}
#psub{font-size:68px;line-height:1.08;color:#fff;margin-top:34px;opacity:0}
.pc{width:290px;height:330px;background:#141414;border:3px solid #2c2840;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.pc img{max-width:230px;max-height:200px;object-fit:contain}
.pc span{font-family:A;font-size:44px;color:#fff;letter-spacing:2px}
#sign{left:0;right:0;top:1790px;z-index:30;display:flex;justify-content:center;align-items:center;gap:18px;opacity:0}
#sign img{width:74px;height:auto}
#sign span{font-size:48px;color:rgba(255,255,255,.85);letter-spacing:8px}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0;z-index:40}
/* portada (primer fotograma) */
#cover{left:0;top:0;width:1080px;height:1920px;z-index:50;display:none}
#cover .pill{display:inline-block;background:#E5F38B;color:#000;font-size:92px;letter-spacing:2px;padding:6px 40px 14px;border-radius:999px}
#cover .w{color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
</style></head><body>
<div id="s">
 <svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0B0A12"/><stop offset=".55" stop-color="#1A1531"/><stop offset="1" stop-color="#2E2557"/></linearGradient>
  <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#262048"/><stop offset="1" stop-color="#16122A"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#sg)"/>
  
  <g id="far"></g>
  <rect x="0" y="1150" width="1080" height="440" fill="url(#sea)"/>
  <g id="waves"></g>
  <g id="world">
   <rect x="-1200" y="1590" width="3480" height="50" fill="#221C3B"/>
   <g id="rail"></g><g id="lamps"></g>
   <rect x="-1200" y="1640" width="3480" height="24" fill="#3a3354"/>
   <rect x="-1200" y="1664" width="3480" height="900" fill="#141414"/>
   <g id="dashes"></g></g>
 </svg>
 <div id="mono" class="abs"></div>
 <div id="chip" class="abs"><span id="chipt">BEHOBIA · 20 KM</span></div>
 <div id="title" class="abs t"></div>
 <div id="teaser" class="abs"><span id="q1">1</span><span id="q2">2</span><span id="q3">3</span></div>
 <div id="card" class="abs"><div id="num" class="abs t">1</div><div id="ctext" class="abs"></div><div id="cnote" class="abs"></div></div>
 <div id="prize" class="abs t"><img src="brand/moneda_moncu.png"><div id="pnum">350</div><div id="plab">MONCUS</div><div id="psub">Sube tu dorsal<br>al reto Behobia.</div></div>
 <div id="prods" class="abs" style="left:60px;right:60px;top:900px;z-index:23;display:flex;justify-content:center;gap:28px;opacity:0">
  <div class="pc"><img src="brand/prod_shoe.png"><span>ZAPATILLAS</span></div>
  <div class="pc"><img src="brand/prod_gel.png"><span>GELES</span></div>
  <div class="pc"><img src="brand/prod_shirt.png"><span>CAMISETAS</span></div></div>
 <div id="bio" class="abs" style="left:0;right:0;top:1500px;text-align:center;z-index:31;opacity:0"><span style="display:inline-block;background:#E5F38B;color:#000;font-family:A;font-size:66px;letter-spacing:3px;padding:8px 44px 14px;border-radius:999px">LINK EN LA BIO 👆</span></div>
 <div id="sign" class="abs"><img src="brand/logo_cara.png"><span>MONCU</span></div>
 <div id="flash" class="abs"></div>
 <div id="cover" class="abs">
  <div class="abs" style="left:0;right:0;top:200px;text-align:center"><span class="pill">¿CORRISTE LA BEHOBIA?</span></div>
  <div class="abs w" style="left:0;right:0;top:345px;text-align:center;font-size:290px;line-height:1">LEE ESTO</div>
  <div class="abs w" style="left:0;right:0;top:665px;text-align:center;font-size:118px;line-height:1.02">ANTES DE VOLVER<br><span style="color:#E5F38B">A CORRER</span></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const sd=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const NS='http://www.w3.org/2000/svg';
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
// Tiempos de cada frase (se reajustan a la voz)
window.T={hook:0,sub:1.48,enh:3.92,km:6.96,cu:8.52,ahora:6.96,t1:10.71,n1:12.72,t2:14.45,n2:16.45,t3:17.8,n3:19.88,premio:21.49,coin:22.93,dorsal:25.64,canjea:28.0,firma:28.6,end:33.0};
// --- Donostia: Igueldo con su torre, isla de Santa Clara con faro, Urgull con el Sagrado Corazón, y la bahía de La Concha
const far=$('far');
// Igueldo (izquierda) y torre
el('path',{d:'M-40 1152 C 40 990 170 950 300 985 C 380 1010 430 1080 470 1152 Z',fill:'#2A2350'},far);
el('rect',{x:196,y:925,width:30,height:60,fill:'#2A2350'},far);el('path',{d:'M190 928 L211 900 L232 928 Z',fill:'#2A2350'},far);
// Santa Clara (centro) y faro
el('path',{d:'M430 1152 C 470 1090 560 1072 620 1095 C 660 1110 690 1135 705 1152 Z',fill:'#302858'},far);
el('rect',{x:555,y:1050,width:16,height:30,fill:'#302858'},far);el('circle',{cx:563,cy:1046,r:7,fill:'#E9E3FD',opacity:.45},far);
// Urgull (derecha) con castillo y Sagrado Corazón
el('path',{d:'M690 1152 C 740 1030 860 975 960 995 C 1030 1010 1070 1060 1110 1152 Z',fill:'#2A2350'},far);
el('rect',{x:858,y:948,width:56,height:40,fill:'#2A2350'},far);
el('rect',{x:879,y:895,width:14,height:56,fill:'#2A2350'},far);el('circle',{cx:886,cy:887,r:9,fill:'#2A2350'},far);
el('rect',{x:866,y:908,width:40,height:8,rx:4,fill:'#2A2350'},far);
// arco de la playa y luces del paseo al fondo
el('path',{d:'M0 1190 Q 540 1240 1080 1190 L1080 1205 Q 540 1255 0 1205 Z',fill:'#3A3264',opacity:.6},far);
for(let i=0;i<24;i++){const x=20+i*45;el('circle',{cx:x,cy:1186+Math.sin(i/23*Math.PI)*24,r:3.2,fill:'#9C8BE0',opacity:.55},far)}
const waves=[];for(let i=0;i<11;i++)waves.push(el('rect',{x:0,y:1250+i*30,width:90+sd(i)*120,height:5,rx:3,fill:'#3A3264',opacity:.55},$('waves')));
// barandilla de La Concha y farolas
const rail=$('rail');const RL=[];
for(let i=0;i<70;i++){const g=el('g',{},rail);g._x=-1200+i*50;el('rect',{x:0,y:1555,width:8,height:85,fill:'#4A4178'},g);el('path',{d:'M4 1566 Q 29 1600 54 1566',fill:'none',stroke:'#4A4178','stroke-width':5},g);el('circle',{cx:29,cy:1612,r:9,fill:'none',stroke:'#4A4178','stroke-width':4},g);RL.push(g)}
const railTop=el('rect',{x:-1200,y:1548,width:3480,height:12,rx:6,fill:'#5A5090'},rail);
const LP=[];for(let i=0;i<8;i++){const g=el('g',{},$('lamps'));g._x=-1200+i*450;
 el('rect',{x:-7,y:1230,width:14,height:410,fill:'#2C2550'},g);el('rect',{x:-16,y:1600,width:32,height:40,fill:'#2C2550'},g);el('path',{d:'M-46 1250 Q 0 1225 46 1250',fill:'none',stroke:'#2C2550','stroke-width':7},g);
 [[-46,1262],[46,1262],[0,1214]].forEach(([x,y])=>el('circle',{cx:x,cy:y,r:15,fill:'#E9E3FD',opacity:.35},g));LP.push(g)}
const dashes=[];for(let i=0;i<14;i++)dashes.push(el('rect',{x:0,y:1790,width:120,height:16,rx:8,fill:'#3a3354'},$('dashes')));
for(let i=0;i<47;i++){const im=document.createElement('img');im.src='gif/m'+String(i).padStart(2,'0')+'.png';im.id='mf'+i;$('mono').appendChild(im)}
let lastF=-1,last='',D=0,lt=null,ph=0;
function setTitle(h){if(h!==last){$('title').innerHTML=h;last=h}}
function render(t){
 const T=window.T;
 // ritmo: alegre al principio, trote suave en la recuperación
 const sp=t<T.ahora?1.15:t<T.premio?.75:1.1;
 if(lt===null||t<lt){D=0;ph=0;lastF=-1;document.querySelectorAll('#mono img').forEach(i=>i.style.display='none')}else{D+=sp*(t-lt);ph+=sp*(t-lt)}lt=t;
 RL.forEach(b=>{const x=((b._x+1200-D*600)%3500+3500)%3500-1200;b.setAttribute('transform',`translate(${x},0)`)});
 LP.forEach(b=>{const x=((b._x+1200-D*600)%3600+3600)%3600-1200;b.setAttribute('transform',`translate(${x},0)`)});
 dashes.forEach((d,i)=>{const x=((i*200-D*950)%2800+2800)%2800-1200;d.setAttribute('x',x)});
 waves.forEach((w,i)=>w.setAttribute('x',((i*137+t*(18+i*3))%1300)-150));
 // mono
 const fr=Math.floor(ph*24)%47;if(fr!==lastF){if(lastF>=0)$('mf'+lastF).style.display='none';$('mf'+fr).style.display='block';lastF=fr}
 const pz=t>=T.premio;
 $('mono').style.transform='none';
 // chip
 $('chipt').textContent=t<T.ahora?'BEHOBIA · DONOSTIA':'MODO RECUPERACIÓN';
 $('chip').style.opacity=t<T.coin?1:0;
 // títulos
 const sc=[[T.hook,'<em>¿Corriste<br>la Behobia?</em><small id="hs">Tenemos algo<br><i>para ti</i>.</small>'],[T.enh,'Pero primero...<br><i>¡enhorabuena,<br>máquina!</i>'],[T.ahora,'Ahora toca<br><i>recuperar</i>.<br><b>3</b> claves.'],[T.t1,''],[T.premio,'¿Y lo que<br>tenemos<br><i>para ti</i>?'],[T.coin,'']];
 let ki=0;sc.forEach((s,i)=>{if(t>=s[0])ki=i});setTitle(sc[ki][1]);const s0=sc[ki][0];
 $('title').style.fontSize=ki===0?'124px':'120px';
 if($('hs'))$('hs').style.opacity=clamp((t-T.sub)/.2);
 if($('l2')){$('l2').style.opacity=clamp((t-T.km-.55)/.15);$('l3').style.opacity=clamp((t-T.km-1.25)/.15)}
 $('title').style.transform=`scale(${.55+.45*back((t-s0)/.3)}) rotate(${ki%2?1.5:-1.5}deg)`;
 // círculos del hook
 [1,2,3].forEach(i=>{const q=t-(.5+i*.28);const e=$('q'+i);const on=false;e.style.opacity=on?1:0;e.style.transform=`scale(${on?back(q/.3):0}) rotate(${(i-2)*6}deg)`});
 // tarjetas
 const cards=[[T.t1,'1','Rodajes suaves<br>esta semana.','Las <b>series</b>, que esperen.'],[T.t2,'2','Agua +<br>proteína.','<b>En cada comida.</b>'],[T.t3,'3','Escucha<br>tus piernas.','Si algo duele, <b>para</b>.']];
 let ci=-1;cards.forEach((c,i)=>{if(t>=c[0]&&t<T.premio)ci=i});
 if(ci>=0){const c=cards[ci];$('card').style.opacity=1;$('num').textContent=c[1];$('ctext').innerHTML=c[2];$('cnote').innerHTML=c[3];
  const q=t-c[0];$('card').style.transform=`translateY(${(1-back(q/.35))*900}px) rotate(${[-2,2,-1.5][ci]}deg)`;$('cnote').style.opacity=clamp((t-[T.n1,T.n2,T.n3][ci])/.2)}else $('card').style.opacity=0;
 // premio
 const pq=t-T.coin;$('prize').style.opacity=pq>0?1:0;
 $('prize').style.transform=`scale(${pq>0?.6+.4*back(pq/.4):0})`;
 $('prize').querySelector('img').style.transform=`rotate(${Math.sin(t*2.2)*4}deg)`;
 $('psub').style.opacity=clamp((t-T.dorsal)/.25);
 $('psub').innerHTML=t<T.canjea?'Sube tu dorsal<br>al reto Behobia.':'¡Y canjéalos por<br><i style="font-style:normal;color:#E5F38B">premios de verdad</i>!';
 // firma
 $('sign').style.opacity=clamp((t-T.firma)/.4);
 const pq2=t-T.canjea;const pon=pq2>0;
 $('prize').querySelector('img').style.display=pon?'none':'inline';$('pnum').style.display=pon?'none':'block';$('plab').style.display=pon?'none':'block';
 if(pon){$('prize').style.top='330px';$('psub').style.fontSize='100px'}else{$('prize').style.top='';$('psub').style.fontSize=''}
 $('prods').style.opacity=pon?1:0;[...$('prods').children].forEach((c,i)=>c.style.transform=`scale(${pon?back((pq2-.15-i*.2)/.3):0}) rotate(${(i-1)*3}deg)`);
 $('bio').style.opacity=clamp((t-T.canjea-1.2)/.3);$('bio').style.transform=`scale(${back((t-T.canjea-1.2)/.3)})`;
 $('mono').style.opacity=pon?0:1;
 $('flash').style.opacity=clamp(1-Math.abs(t-T.coin)/.1)*.15;
 // portada en el primer fotograma
 $('cover').style.display=t<1/30?'block':'none';
 ['title','teaser','chip'].forEach(id=>$(id).style.visibility=t<1/30?'hidden':'visible');
}
window.render=render;render(0);
</script></body></html>
