<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:A;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif}
.abs{position:absolute}
.t{color:#FFFFFF;text-align:center;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.55)}
#title{left:40px;right:40px;top:330px;font-size:120px;line-height:1.04;z-index:20}
#title i{font-style:normal;color:#E5F38B}#title b{font-weight:400;color:#7B5CF0}
#title em{font-style:normal;display:inline-block;background:#E5F38B;color:#000;text-shadow:none;padding:4px 26px 10px;border-radius:20px}
#chip{left:0;right:0;top:95px;text-align:center;z-index:21}
#chip span{display:inline-block;background:rgba(255,255,255,.06);color:#FFFFFF;font-family:A;font-size:44px;letter-spacing:4px;padding:8px 30px 10px;border:3px solid rgba(255,255,255,.25);border-radius:999px}
#air{left:290px;width:500px;top:200px;height:56px;z-index:21;display:flex;align-items:center;gap:16px}
#air span{font-family:A;font-size:38px;color:#A3A3A3;letter-spacing:4px}
#airbar{flex:1;height:22px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);overflow:hidden}
#airfill{height:100%;width:100%;border-radius:999px;background:#7B5CF0}
#teaser{left:0;right:0;top:860px;display:flex;justify-content:center;gap:40px;z-index:19}
#teaser span{width:140px;height:140px;border-radius:50%;background:#7B5CF0;color:#FFF;line-height:140px;font-size:110px;text-align:center;font-family:A;opacity:0}
#teaser span.l{background:#E5F38B;color:#000}
#card{left:80px;right:80px;top:720px;height:400px;z-index:19;background:#141414;border:3px solid #2c2840;border-radius:40px;box-shadow:0 30px 60px rgba(0,0,0,.45);opacity:0}
#badge{right:40px;top:-34px;background:#E5F38B;color:#000;font-size:40px;letter-spacing:2px;padding:4px 24px 8px;border-radius:999px;opacity:0}
#num{left:44px;top:44px;width:140px;height:140px;border-radius:50%;background:#7B5CF0;color:#FFF;font-size:96px;line-height:140px;text-align:center;text-shadow:none}
#ctext{left:220px;right:40px;top:40px;color:#FFFFFF;font-size:80px;line-height:1.05}
#cnote{left:44px;right:44px;top:250px;color:#A3A3A3;font-family:P;font-size:44px;line-height:1.3}
#cnote b{color:#E5F38B}
#mono{left:250px;top:1110px;width:580px;height:580px;z-index:10;transform-origin:50% 95%}
#mono img{position:absolute;left:0;top:0;width:580px;height:580px;display:none}
.gh{top:1250px;width:300px;height:300px;z-index:5;filter:brightness(0) invert(1) opacity(.13)}
.gh img{position:absolute;left:0;top:0;width:300px;height:300px;display:none}
#mark{left:0;right:0;top:1715px;text-align:center;z-index:30;font-size:40px;letter-spacing:8px;color:rgba(255,255,255,.55);opacity:0}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0;z-index:40}
#cover{left:0;top:0;width:1080px;height:1920px;z-index:50;display:none}
#cover .pill{display:inline-block;background:#E5F38B;color:#000;font-size:96px;letter-spacing:2px;padding:6px 44px 14px;border-radius:999px}
#cover .w{color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
</style></head><body>
<div id="s">
 <svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><radialGradient id="halo"><stop offset="0" stop-color="#E9E3FD" stop-opacity=".35"/><stop offset="1" stop-color="#E9E3FD" stop-opacity="0"/></radialGradient><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0B0A12"/><stop offset=".55" stop-color="#1A1531"/><stop offset="1" stop-color="#2E2557"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#sg)"/>
  <g id="stars"></g><g id="far"></g><g id="lamps"></g><g id="mid"></g><g id="leaves"></g>
  <rect x="0" y="1560" width="1080" height="80" fill="#1C1733"/>
  <g id="world">
   <g id="posts"></g>
   <rect x="-1200" y="1640" width="3480" height="24" fill="#3a3354"/>
   <rect x="-1200" y="1664" width="3480" height="900" fill="#141414"/>
   <g id="dashes"></g></g>
 </svg>
 <div id="g0" class="abs gh"></div><div id="g1" class="abs gh"></div>
 <div id="mono" class="abs"></div>
 <div id="chip" class="abs"><span id="chipt">KM 0,0</span></div>
 <div id="air" class="abs"><span>AIRE</span><div id="airbar"><div id="airfill"></div></div></div>
 <div id="title" class="abs t"></div>
 <div id="teaser" class="abs"><span id="q1">1</span><span id="q2">2</span><span id="q3" class="l">3</span></div>
 <div id="card" class="abs"><div id="badge" class="abs">EL MÁS IMPORTANTE</div><div id="num" class="abs t">1</div><div id="ctext" class="abs"></div><div id="cnote" class="abs"></div></div>
 <div id="mark" class="abs">MONCU</div>
 <div id="flash" class="abs"></div>
 <div id="cover" class="abs">
  <div class="abs" style="left:0;right:0;top:170px;text-align:center"><span class="pill">¿SALES A TOPE?</span></div>
  <div class="abs w" style="left:0;right:0;top:380px;text-align:center;font-size:225px;line-height:1">A LOS 3 KM</div>
  <div class="abs" style="left:0;right:0;top:630px;text-align:center;font-size:230px;line-height:1;color:#E5F38B;text-shadow:0 6px 30px rgba(0,0,0,.6)">TE AHOGAS</div>
  <div class="abs w" style="left:0;right:0;top:900px;text-align:center;font-family:P;font-size:56px">Esto lo arregla.</div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const sd=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const NS='http://www.w3.org/2000/svg';
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
// Tiempos de cada frase (se reajustan a la voz)
window.T={hook:0,causa:4.31,rapido:6.02,trucos:8.29,t1:12.02,n1:14.22,t2:18.21,n2:20.02,t3:25.56,q3:30.99,n3:32.7,guarda:36.67,end:39.3};
// --- parque al anochecer: pinos y árboles en morados apagados, farolas y postes kilométricos
const far=$('far'),mid=$('mid');
el('path',{d:'M0 1300 C 200 1250 380 1290 560 1260 C 760 1230 900 1280 1080 1250 L1080 1560 L0 1560 Z',fill:'#1E1938'},far);
const FT=[];for(let i=0;i<14;i++){const g=el('g',{},far);g._x=i*170;const h=180+sd(i)*120;
 if(i%3==0){el('path',{d:`M0 ${1300-h} L60 1300 L-60 1300 Z`,fill:'#251F44'},g)}else{el('circle',{cx:0,cy:1300-h*.55,r:70+sd(i+3)*30,fill:'#251F44'},g)}
 el('rect',{x:-6,y:1290,width:12,height:40,fill:'#251F44'},g);FT.push(g)}
const MT=[];for(let i=0;i<9;i++){const g=el('g',{},mid);g._x=i*300;const h=300+sd(i+9)*160;
 if(i%2==0){el('path',{d:`M0 ${1560-h} L90 ${1560-h*.45} L50 ${1560-h*.45} L120 1540 L-120 1540 L-50 ${1560-h*.45} L-90 ${1560-h*.45} Z`,fill:'#2C2550'},g)}else{el('circle',{cx:-30,cy:1560-h*.6,r:95,fill:'#2C2550'},g);el('circle',{cx:50,cy:1560-h*.5,r:85,fill:'#2C2550'},g)}
 el('rect',{x:-10,y:1500,width:20,height:70,fill:'#2C2550'},g);MT.push(g)}
// postes kilométricos
const PS=[];for(let i=0;i<3;i++){const g=el('g',{},$('posts'));g._x=-1200+i*1200;
 el('rect',{x:-8,y:1470,width:16,height:170,fill:'#3a3360'},g);el('rect',{x:-70,y:1440,width:140,height:70,rx:12,fill:'#2A2350',stroke:'#4A4178','stroke-width':3},g);
 const tx=el('text',{x:0,y:1490,'text-anchor':'middle','font-family':'A','font-size':38,fill:'#B9AEE8'},g);tx.textContent='KM';g._t=tx;PS.push(g)}
const ST=[];for(let i=0;i<46;i++)ST.push(el('circle',{cx:sd(i+50)*1080,cy:40+sd(i+90)*1050,r:1.5+sd(i+7)*2.2,fill:'#E9E3FD'},$('stars')));
const LM=[];for(let i=0;i<4;i++){const g=el('g',{},$('lamps'));g._x=i*620;
 el('circle',{cx:0,cy:1385,r:90,fill:'url(#halo)'},g);el('rect',{x:-5,y:1390,width:10,height:180,fill:'#2C2550'},g);el('circle',{cx:0,cy:1385,r:11,fill:'#E9E3FD',opacity:.55},g);LM.push(g)}
const LV=[];for(let i=0;i<9;i++)LV.push(el('rect',{x:0,y:0,width:14,height:8,rx:4,fill:i%3?'#4A4178':'#7B5CF0',opacity:.5},$('leaves')));
const GH=[0,1].map(k=>{const d=$('g'+k);const a=[];for(let i=0;i<47;i++){const im=document.createElement('img');im.src='gif/m'+String(i).padStart(2,'0')+'.png';d.appendChild(im);a.push(im)}return {d,a,last:-1}});
const dashes=[];for(let i=0;i<14;i++)dashes.push(el('rect',{x:0,y:1790,width:120,height:16,rx:8,fill:'#3a3354'},$('dashes')));
for(let i=0;i<47;i++){const im=document.createElement('img');im.src='gif/m'+String(i).padStart(2,'0')+'.png';im.id='mf'+i;$('mono').appendChild(im)}
let lastF=-1,last='',D=0,lt=null,ph=0;
function setTitle(h){if(h!==last){$('title').innerHTML=h;last=h}}
function speed(t){const T=window.T;
 if(t<T.causa)return 2.0;               // sale a tope
 if(t<T.trucos)return 2.0-1.1*sm((t-T.causa)/1.2); // se ahoga y frena
 if(t<T.n2)return .9;                    // ritmo cómodo
 if(t<T.t3)return .9+.5*sm((t-T.n2)/1.2); // segunda mitad más rápida
 return 1.4-.55*sm((t-T.t3)/1.2);        // y vuelta a empezar lento
}
function air(t){const T=window.T;
 if(t<T.causa)return 1-.85*sm(t/T.causa);
 if(t<T.t1)return .15+.05*sm((t-T.causa)/2);
 if(t<T.t3)return .2+.6*sm((t-T.t1)/4);
 return .8;
}
function render(t){
 const T=window.T;const sp=speed(t);
 if(lt===null||t<lt){D=0;ph=0;lastF=-1;document.querySelectorAll('#mono img').forEach(i=>i.style.display='none')}else{D+=sp*(t-lt);ph+=sp*(t-lt)}lt=t;
 FT.forEach(b=>{const x=((b._x-D*90)%2380+2380)%2380-150;b.setAttribute('transform',`translate(${x},0)`)});
 MT.forEach(b=>{const x=((b._x-D*260)%2700+2700)%2700-300;b.setAttribute('transform',`translate(${x},0)`)});
 const km=Math.min(5,(t<T.causa?2.9*sm(t/T.causa):2.9+2.1*(t-T.causa)/(T.end-T.causa)));
 PS.forEach((b,i)=>{const raw=b._x+1200-D*600;const x=((raw)%3600+3600)%3600-1200;b.setAttribute('transform',`translate(${x},0)`)});
 PS.forEach(b=>b._t.textContent='KM '+Math.max(1,Math.round(km+.5)));
 dashes.forEach((d,i)=>{const x=((i*200-D*950)%2800+2800)%2800-1200;d.setAttribute('x',x)});
 ST.forEach((c,i)=>c.setAttribute('opacity',(.12+.28*(.5+.5*Math.sin(t*(.8+sd(i)*1.6)+i))).toFixed(3)));
 LM.forEach(b=>{const x=((b._x-D*260)%2480+2480)%2480-200;b.setAttribute('transform',`translate(${x},0)`)});
 LV.forEach((l,i)=>{const sp2=60+sd(i+30)*70;const x=((sd(i+11)*1300-D*(380+sd(i)*200)-t*30)%1400+1400)%1400-160;const y=300+((sd(i+20)*1400+t*sp2)%1300);l.setAttribute('transform',`translate(${x},${y}) rotate(${t*90*(i%2?1:-1)+i*40})`)});
 GH.forEach((g,k)=>{const x=((k*900+(1.15*t-D)*520)%1800+1800)%1800-500;g.d.style.left=x+'px';const f=Math.floor((t*1.15+k*.4)*24)%47;if(f!==g.last){if(g.last>=0)g.a[g.last].style.display='none';g.a[f].style.display='block';g.last=f}});
 const fr=Math.floor(ph*24)%47;if(fr!==lastF){if(lastF>=0)$('mf'+lastF).style.display='none';$('mf'+fr).style.display='block';lastF=fr}
 // el mono "se ahoga": se hunde un poco y se inclina cuando le falta aire
 const a=air(t);const tired=t>=T.causa&&t<T.t1?clamp((.45-a)/.3):0;
 $('mono').style.transform=`translate(0,${tired*30}px) rotate(${tired*6}deg)`;
 // chip y barra de aire
 $('chipt').textContent='KM '+km.toFixed(1).replace('.',',');
 $('airfill').style.width=(a*100)+'%';
 const blink=a<.3?(.55+.45*Math.abs(Math.sin(t*9))):1;
 $('airfill').style.opacity=blink;
 $('airfill').style.background=t>=T.n3?'#E5F38B':'#7B5CF0';
 const hud=t<T.guarda?1:clamp(1-(t-T.guarda)/.4);$('chip').style.opacity=hud;$('air').style.opacity=hud;
 // títulos
 const sc=[[T.hook,'<em>¿Sales a tope</em><br>y a los <b>3 km</b><br>te <i>ahogas</i>?'],[T.causa,'No estás<br>en <i>mala forma</i>.'],[T.rapido,'Es que sales<br><i>demasiado<br>rápido</i>.'],[T.trucos,'<b>3</b> trucos.<br>El último,<br><i>el más importante</i>.'],[T.t1,''],[T.guarda,'Guárdalo para<br>tu <i>próxima salida</i>.']];
 let ki=0;sc.forEach((s,i)=>{if(t>=s[0])ki=i});setTitle(sc[ki][1]);const s0=sc[ki][0];
 $('title').style.transform=`scale(${.55+.45*back((t-s0)/.3)}) rotate(${ki%2?1.5:-1.5}deg)`;
 // círculos 1-2-3 (el 3 en lima: el que nadie hace)
 [1,2,3].forEach(i=>{const q=t-(T.trucos+.35+i*.25);const e=$('q'+i);const on=q>0&&t<T.t1;e.style.opacity=on?1:0;e.style.transform=`scale(${on?back(q/.3):0}) rotate(${(i-2)*6}deg)`});
 // tarjetas
 const cards=[[T.t1,'1','Respira<br>con ritmo.','Coges aire en 3 pasos.<br><b>Lo sueltas en 3.</b>'],[T.t2,'2','La 2.ª mitad,<br>más rápida.','Y acabas <b>adelantando</b><br>a los que te pasaron.'],[T.t3,'3','Los primeros<br>10 min, lento.','Si puedes hablar, vas bien.<br>Si solo jadeas, <b>frena</b>.']];
 let ci=-1;cards.forEach((c,i)=>{if(t>=c[0]&&t<T.guarda)ci=i});
 if(ci>=0){const c=cards[ci];$('card').style.opacity=1;$('num').textContent=c[1];$('ctext').innerHTML=c[2];$('cnote').innerHTML=(ci===2&&t<T.n3)?'¿Y cómo sabes<br>si vas bien?':c[3];
  const q=t-c[0];$('card').style.transform=`translateY(${(1-back(q/.35))*900}px) rotate(${[-2,2,-1.5][ci]}deg)`;$('cnote').style.opacity=clamp((t-[T.n1,T.n2,T.q3][ci])/.2);
  $('badge').style.opacity=ci===2?clamp((q-.3)/.2):0}else $('card').style.opacity=0;
 $('mark').style.opacity=clamp((t-T.guarda-1)/.5);
 $('flash').style.opacity=clamp(1-Math.abs(t-T.trucos)/.1)*.12;
 $('cover').style.display=t<1/30?'block':'none';
 ['title','teaser','chip','air'].forEach(id=>$(id).style.visibility=t<1/30?'hidden':'visible');
}
window.render=render;render(0);
</script></body></html>
