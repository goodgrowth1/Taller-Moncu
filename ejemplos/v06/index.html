<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:A;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif}
.abs{position:absolute}
.t{color:#FFFFFF;text-align:center;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.55)}
#title{left:40px;right:40px;top:330px;font-size:118px;line-height:1.04;z-index:20}
#title i{font-style:normal;color:#E5F38B}#title b{font-weight:400;color:#7B5CF0}
#title em{font-style:normal;display:inline-block;background:#E5F38B;color:#000;text-shadow:none;padding:4px 26px 10px;border-radius:20px}
#title small{display:block;font-size:96px;line-height:1.06;margin-top:20px}
#cnt{left:0;right:0;top:90px;text-align:center;z-index:21}
#cnt span{display:inline-flex;align-items:center;gap:18px;background:rgba(255,255,255,.06);color:#FFFFFF;font-size:56px;letter-spacing:2px;padding:8px 34px 12px;border:3px solid rgba(255,255,255,.25);border-radius:999px}
#cnt small{font-size:36px;letter-spacing:4px;color:#A3A3A3}
#cnt b{font-weight:400;color:#fff}
#chips{left:0;right:0;top:760px;display:flex;justify-content:center;gap:22px;z-index:19}
#chips span{background:#141414;border:3px solid #2c2840;color:#fff;font-size:58px;padding:10px 30px 14px;border-radius:999px;opacity:0}
#chips span b{font-weight:400;color:#7B5CF0}
#bub{left:110px;right:110px;top:640px;z-index:19;background:#F4F1FF;color:#111;border-radius:44px;padding:40px 50px 46px;text-align:center;opacity:0;box-shadow:0 30px 60px rgba(0,0,0,.4)}
#bub:after{content:'';position:absolute;left:46%;bottom:-38px;border:22px solid transparent;border-top:26px solid #F4F1FF;border-left-width:14px}
#bq{font-size:96px;line-height:1.04}
#bs{font-family:P;font-size:46px;line-height:1.25;color:#4b4562;margin-top:16px}
#bp{right:-30px;top:-40px;background:#7B5CF0;color:#fff;font-size:52px;padding:4px 24px 8px;border-radius:999px}
#card{left:80px;right:80px;top:700px;height:420px;z-index:19;background:#141414;border:3px solid #2c2840;border-radius:40px;box-shadow:0 30px 60px rgba(0,0,0,.45);opacity:0}
#ctag{left:44px;top:-36px;background:#E5F38B;color:#000;font-size:46px;letter-spacing:3px;padding:4px 28px 8px;border-radius:999px}
#ctext{left:50px;right:40px;top:60px;color:#FFFFFF;font-size:104px;line-height:1.02}
#cnote{left:50px;right:44px;top:290px;color:#A3A3A3;font-family:P;font-size:48px;line-height:1.3}
#cnote b{color:#E5F38B}
#mono{left:250px;top:1110px;width:580px;height:580px;z-index:10}
#mono img{position:absolute;left:0;top:0;width:580px;height:580px;display:none}
#coin{left:0;right:0;top:250px;z-index:22;text-align:center;opacity:0}
#coin img{width:250px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}
#cn{font-size:170px;line-height:1;color:#7B5CF0;margin-top:6px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#cl{font-size:96px;line-height:1;color:#E5F38B;letter-spacing:6px}
#sub2{left:40px;right:40px;top:1000px;z-index:22;font-size:76px;line-height:1.08;opacity:0}
#sign{left:0;right:0;top:1790px;z-index:30;display:flex;justify-content:center;align-items:center;gap:18px;opacity:0}
#sign img{width:74px;height:auto}
#sign span{font-size:48px;color:rgba(255,255,255,.85);letter-spacing:8px}
#cover{left:0;top:0;width:1080px;height:1920px;z-index:50;display:none}
#cover .pill{display:inline-block;background:#E5F38B;color:#000;font-size:96px;letter-spacing:2px;padding:6px 44px 14px;border-radius:999px}
#cover .w{color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
</style></head><body>
<div id="s">
 <svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0B0A12"/><stop offset=".55" stop-color="#1A1531"/><stop offset="1" stop-color="#2E2557"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#9C8BE0" stop-opacity=".28"/><stop offset="1" stop-color="#9C8BE0" stop-opacity="0"/></radialGradient></defs>
  <rect width="1080" height="1920" fill="url(#sg)"/>
  <g id="stars"></g><g id="far"></g><g id="shops"></g>
  <rect x="0" y="1620" width="1080" height="20" fill="#2a2347"/>
  <rect x="0" y="1640" width="1080" height="24" fill="#3a3354"/>
  <rect x="0" y="1664" width="1080" height="900" fill="#141414"/>
  <g id="dashes"></g>
 </svg>
 <div id="mono" class="abs"></div>
 <div id="cnt" class="abs"><span><small id="cntl">TU GASTO</small><b id="cntv">0 €</b></span></div>
 <div id="title" class="abs t"></div>
 <div id="chips" class="abs"><span id="c0"></span><span id="c1"></span><span id="c2"></span></div>
 <div id="bub" class="abs"><div id="bp" class="abs">+2,50 €</div><div id="bq"></div><div id="bs"></div></div>
 <div id="card" class="abs"><div id="ctag" class="abs">UN CONSEJO</div><div id="ctext" class="abs"></div><div id="cnote" class="abs"></div></div>
 <div id="coin" class="abs t"><img src="brand/moneda_moncu.png"><div id="cn">0</div><div id="cl">MONCUS</div></div>
 <div id="sub2" class="abs t"></div>
 <div id="sign" class="abs"><img src="brand/logo_cara.png"><span>MONCU</span></div>
 <div id="cover" class="abs">
  <div class="abs" style="left:0;right:0;top:180px;text-align:center"><span class="pill">“CORRER ES GRATIS”</span></div>
  <div class="abs w" style="left:0;right:0;top:350px;text-align:center;font-size:240px;line-height:1">DEJA DE</div>
  <div class="abs w" style="left:0;right:0;top:590px;text-align:center;font-size:240px;line-height:1">PAGAR</div>
  <div class="abs" style="left:0;right:0;top:830px;text-align:center;font-size:240px;line-height:1;color:#E5F38B;text-shadow:0 6px 30px rgba(0,0,0,.6)">DE MÁS</div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const sd=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const NS='http://www.w3.org/2000/svg';
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
// Tiempos de cada frase (sincronizados con la voz)
window.T={hook:0,paga:1.5,sabe:2.86,gratis:4.44,suma:6.4,zap:7.2,rel:8.05,dor:8.75,igual:9.79,b1:11.41,b2:12.99,b2s:14.21,b3:16.12,b3s:17.33,gym:19.74,consejo:24.87,modelo:26.43,barato:29.76,moncu:31.66,pasta:34.84,coin:37.71,canjea:39.61,ch:42.71,marcas:45.05,desc:46.84,lado:48.92,end:51.6};
// --- calle de tiendas al anochecer: edificios, escaparates encendidos y toldos, en morados apagados
const ST=[];for(let i=0;i<34;i++)ST.push(el('circle',{cx:sd(i+50)*1080,cy:40+sd(i+90)*700,r:1.4+sd(i+7)*2,fill:'#E9E3FD'},$('stars')));
const BF=[];for(let i=0;i<10;i++){const g=el('g',{},$('far'));g._x=i*240;const h=420+sd(i+3)*360;
 el('rect',{x:0,y:1620-h,width:230,height:h,fill:'#1F1A39'},g);
 for(let r=0;r<Math.floor((h-260)/90);r++)for(let c=0;c<3;c++)if(sd(i*31+r*7+c)>.45)el('rect',{x:30+c*62,y:1620-h+40+r*90,width:34,height:46,rx:4,fill:'#3A3264',opacity:.5+sd(i+r+c)*.4},g);BF.push(g)}
const SH=[];const awn=['#2C2550','#33295C','#2A2348'];
for(let i=0;i<6;i++){const g=el('g',{},$('shops'));g._x=i*420;
 el('rect',{x:0,y:1330,width:400,height:290,fill:'#241E42'},g);
 el('circle',{cx:200,cy:1500,r:230,fill:'url(#glow)'},g);
 el('rect',{x:34,y:1420,width:332,height:200,rx:10,fill:'#3B3266',opacity:.75},g);
 // siluetas sencillas en el escaparate: zapatilla / reloj / camiseta
 const k=i%3;
 if(k===0){el('path',{d:'M110 1585 C 110 1555 150 1545 175 1550 C 205 1556 230 1572 290 1575 C 305 1576 305 1592 290 1592 L 115 1592 Z',fill:'#5A4E92'},g)}
 if(k===1){el('rect',{x:185,y:1500,width:30,height:110,rx:12,fill:'#5A4E92'},g);el('circle',{cx:200,cy:1555,r:36,fill:'#5A4E92'},g);el('circle',{cx:200,cy:1555,r:24,fill:'#3B3266'},g)}
 if(k===2){el('path',{d:'M140 1500 L180 1480 L220 1480 L260 1500 L248 1530 L236 1525 L236 1600 L164 1600 L164 1525 L152 1530 Z',fill:'#5A4E92'},g)}
 el('path',{d:'M20 1330 L380 1330 L400 1390 L0 1390 Z',fill:awn[k]},g);
 for(let s=0;s<8;s++)el('rect',{x:s*50,y:1390,width:25,height:14,fill:awn[k],opacity:.7},g);
 SH.push(g)}
const dashes=[];for(let i=0;i<14;i++)dashes.push(el('rect',{x:0,y:1790,width:120,height:16,rx:8,fill:'#3a3354'},$('dashes')));
for(let i=0;i<47;i++){const im=document.createElement('img');im.src='gif/m'+String(i).padStart(2,'0')+'.png';im.id='mf'+i;$('mono').appendChild(im)}
let lastF=-1,last='',D=0,lt=null;
function setTitle(h){if(h!==last){$('title').innerHTML=h;last=h}}
const fmt=v=>v.toLocaleString('es-ES',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €';
function render(t){
 const T=window.T;
 if(lt===null||t<lt){D=0;lastF=-1;document.querySelectorAll('#mono img').forEach(i=>i.style.display='none')}else D+=(t-lt);lt=t;
 ST.forEach((c,i)=>c.setAttribute('opacity',(.1+.25*(.5+.5*Math.sin(t*(.8+sd(i)*1.6)+i))).toFixed(3)));
 BF.forEach(b=>{const x=((b._x-D*120)%2400+2400)%2400-240;b.setAttribute('transform',`translate(${x},0)`)});
 SH.forEach(b=>{const x=((b._x-D*560)%2520+2520)%2520-420;b.setAttribute('transform',`translate(${x},0)`)});
 dashes.forEach((d,i)=>{const x=((i*200-D*950)%2800+2800)%2800-1200;d.setAttribute('x',x)});
 const fr=Math.floor(D*24)%47;if(fr!==lastF){if(lastF>=0)$('mf'+lastF).style.display='none';$('mf'+fr).style.display='block';lastF=fr}
 // contador de gasto (ilustrativo)
 const steps=[[T.zap,120],[T.rel,250],[T.dor,60],[T.b1,2.5],[T.b2,35],[T.b3,399]];
 let g=0;steps.forEach(([a,v])=>{g+=v*ease((t-a)/.45)});
 const showCnt=t>=T.gratis&&t<T.moncu;
 $('cnt').style.opacity=showCnt?1:0;
 $('cntv').textContent=fmt(Math.round(g*100)/100);
 const bump=steps.reduce((m,[a])=>Math.max(m,clamp(1-(t-a)/.3)*(t>=a?1:0)),0);
 const shake=t>=T.gym&&t<T.consejo?Math.sin(t*40)*4*clamp(1-(t-T.gym)/1.2):0;
 $('cnt').style.transform=`scale(${1+bump*.12}) translateX(${shake}px)`;
 $('cntv').style.color=t>=T.gym&&t<T.moncu?'#E5F38B':'#fff';
 // títulos
 const sc=[[T.hook,'<em>¿De qué lado<br>corres tú?</em><small id="h2">¿Del que <b>paga de más</b>...</small><small id="h3">o del que <i>sabe esto</i>?</small>'],
  [T.gratis,'Correr es <i>gratis</i>,<br>¿eh?'],[T.suma,'Hasta que<br><i>sumas</i>...'],[T.igual,'Y siempre<br>empieza <i>igual</i>.'],[T.b1,''],
  [T.gym,'Llevas más gastado<br>en correr que en<br>el <i>gimnasio</i><br>que nunca pisaste.'],[T.consejo,''],
  [T.moncu,'En <i>Moncu</i><br>nos dimos cuenta.'],[T.pasta,'Que cada km<br>te ayude a no<br>perder <i>tanta pasta</i>.'],[T.coin,''],
  [T.desc,'Descárgatela<br>y <i>empieza a sumar</i>.'],[T.lado,'Ya sabes de qué lado<br>corremos <i>nosotros</i>.']];
 let ki=0;sc.forEach((s,i)=>{if(t>=s[0])ki=i});setTitle(sc[ki][1]);const s0=sc[ki][0];
 $('title').style.transform=`scale(${.55+.45*back((t-s0)/.3)}) rotate(${ki%2?1.5:-1.5}deg)`;
 if($('h2')){$('h2').style.opacity=clamp((t-T.paga)/.2);$('h3').style.opacity=clamp((t-T.sabe)/.2)}
 // chips: zapatillas, reloj, dorsales (y luego lo que canjeas)
 const ch1=t>=T.suma&&t<T.igual, ch2=t>=T.ch&&t<T.desc;
 const labels=ch2?['ZAPATILLAS','GELES','MATERIAL']:['ZAPATILLAS','RELOJ','DORSALES'];
 const tms=ch2?[T.ch,T.ch+.55,T.ch+1.1]:[T.zap,T.rel,T.dor];
 $('chips').style.top=ch2?'1030px':'760px';
 [0,1,2].forEach(i=>{const e=$('c'+i);e.textContent=labels[i];const q=t-tms[i];const on=(ch1||ch2)&&q>0;e.style.opacity=on?1:0;e.style.transform=`scale(${on?back(q/.3):0}) rotate(${(i-1)*3}deg)`;e.style.borderColor=ch2?'#7B5CF0':'#2c2840'});
 // bocadillos "es solo..."
 const bubs=[[T.b1,'“Bah, es solo<br>un gel.”','',2.5,T.b1],[T.b2,'“Es solo<br>un dorsal...”','...que es la media de mi ciudad, hombre.',35,T.b2s],[T.b3,'“Es solo<br>un reloj.”','Que el mío no me dice el VO2 máx.',399,T.b3s]];
 let bi=-1;bubs.forEach((b,i)=>{if(t>=b[0]&&t<T.gym)bi=i});
 if(bi>=0){const b=bubs[bi];const q=t-b[0];$('bub').style.opacity=1;$('bq').innerHTML=b[1];$('bs').innerHTML=b[2];$('bs').style.opacity=clamp((t-b[4])/.2);
  $('bs').style.display=b[2]?'block':'none';$('bp').textContent='+'+fmt(b[3]);
  $('bub').style.transform=`scale(${back(q/.3)}) rotate(${[-2,2,-1.5][bi]}deg)`}else $('bub').style.opacity=0;
 // tarjeta del consejo
 if(t>=T.consejo&&t<T.moncu){const q=t-T.consejo;$('card').style.opacity=1;$('card').style.transform=`translateY(${(1-back(q/.35))*900}px) rotate(-1.5deg)`;
  $('ctext').innerHTML='El modelo<br>del año pasado.';$('ctext').style.opacity=clamp((t-T.modelo)/.2);
  $('cnote').innerHTML='Casi igual.<br><b>Y suele costar bastante menos.</b>';$('cnote').style.opacity=clamp((t-T.barato)/.2)}else $('card').style.opacity=0;
 // Moncus
 const cq=t-T.coin;const coinOn=cq>0&&t<T.desc;$('coin').style.opacity=coinOn?1:0;
 $('coin').style.transform=`scale(${coinOn?.6+.4*back(cq/.4):0})`;
 $('coin').querySelector('img').style.transform=`rotate(${Math.sin(t*2.2)*4}deg)`;
 $('cn').textContent=Math.round(250*ease((t-T.coin)/5)).toLocaleString('es-ES');
 const s2=t>=T.canjea&&t<T.desc;$('sub2').style.opacity=s2?1:0;
 $('sub2').innerHTML=t<T.marcas?'Y los canjeas por lo que<br>de verdad necesitas.':'De marcas que<br><i style="font-style:normal;color:#E5F38B">ya conoces</i>.';
 $('sub2').style.top='850px';
 $('sign').style.opacity=clamp((t-T.desc)/.4);
 $('cover').style.display=t<1/30?'block':'none';
 ['title','cnt','chips'].forEach(id=>$(id).style.visibility=t<1/30?'hidden':'visible');
}
window.render=render;render(0);
</script></body></html>
