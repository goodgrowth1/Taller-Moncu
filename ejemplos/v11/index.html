<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:A;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif;background:radial-gradient(ellipse at 50% 45%,#2E2464 0%,#17123A 50%,#0B0A12 100%)}
.abs{position:absolute}
.t{color:#fff;text-align:center;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.6)}
#title{left:40px;right:40px;top:250px;font-size:124px;line-height:1.02;z-index:20}
#title b{font-weight:400;color:#9C86F5}#title i{font-style:normal;color:#E5F38B}
#sub{left:0;right:0;top:1720px;font-family:P;font-size:44px;color:#C9C3DD;z-index:20;text-align:center}
#phone{left:330px;top:560px;width:420px;height:700px;border-radius:56px;background:#0E0C18;border:10px solid #3A3360;z-index:12;box-shadow:0 40px 80px rgba(0,0,0,.5);overflow:hidden}
#ph-h{position:absolute;left:0;right:0;top:34px;text-align:center;font-family:P;font-size:30px;color:#A3A3A3;letter-spacing:2px}
#medals{position:absolute;left:30px;right:30px;top:100px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px;justify-items:center}
.md{width:100px;height:130px;position:relative;opacity:0}
.md .rb{position:absolute;left:30px;top:0;width:40px;height:44px;background:#7B5CF0;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.md .c{position:absolute;left:0;top:30px;width:100px;height:100px;border-radius:50%;background:#C9C3DD;border:6px solid #8E87A8;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:30px;color:#2A2350}
#cnt{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:56px;color:#fff;opacity:0}
#btn{position:absolute;left:50px;right:50px;top:570px;height:90px;border-radius:999px;background:#7B5CF0;color:#fff;font-size:50px;text-align:center;line-height:88px;opacity:0}
#toast{left:250px;right:250px;top:1080px;z-index:14;background:#F4F1FF;color:#111;border-radius:28px;padding:20px 30px;font-family:P;font-size:40px;text-align:center;opacity:0;box-shadow:0 20px 40px rgba(0,0,0,.4)}
#zero{left:0;right:0;top:760px;z-index:15;text-align:center;opacity:0}
#zero span{display:inline-block;border:12px solid #9C86F5;border-radius:26px;color:#fff;font-size:150px;letter-spacing:4px;padding:0 44px 10px;background:rgba(11,10,18,.88)}
#zero small{display:block;font-size:52px;color:#9C86F5;letter-spacing:6px;margin-top:-2px}
#mon{left:0;right:0;top:560px;height:760px;z-index:12;opacity:0}
#coin{position:absolute;left:390px;top:20px;width:300px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}
#mcount{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:120px;color:#9C86F5;line-height:1}
#mcount small{display:block;font-size:56px;color:#fff;letter-spacing:6px}
#rate{position:absolute;left:0;right:0;top:540px;text-align:center;opacity:0}
#rate span{display:inline-block;background:#141414;border:3px solid #7B5CF0;border-radius:999px;color:#fff;font-size:56px;padding:6px 34px 12px}
#shoe{position:absolute;left:250px;top:30px;width:580px;height:470px;border-radius:44px;background:#141414;border:3px solid #2c2840;opacity:0}
#shoe img{position:absolute;left:40px;top:90px;width:500px}
#shoe .tag{position:absolute;right:-20px;top:-30px;background:#7B5CF0;color:#fff;font-size:62px;letter-spacing:3px;padding:4px 30px 10px;border-radius:999px;transform:rotate(6deg)}
#shoe .nm{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:52px;color:#fff;letter-spacing:2px}
#end{left:0;right:0;top:640px;z-index:22;text-align:center;opacity:0}
#end .lg{width:340px;height:340px;border-radius:72px;background:#000;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #7B5CF0,0 0 120px rgba(123,92,240,.55)}
#end .lg img{width:250px}
#bio{margin-top:70px;opacity:0}
#bio span{display:inline-block;background:#7B5CF0;color:#fff;font-size:70px;letter-spacing:3px;padding:8px 46px 14px;border-radius:999px}
#mono{left:330px;top:1240px;width:420px;height:420px;z-index:10}
#mono img{position:absolute;left:0;top:0;width:420px;height:420px;display:none}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0;z-index:40}
</style></head><body>
<div id="s">
 <svg class="abs" style="left:0;top:0" width="1080" height="1920">
  <g id="rays" opacity="0"></g>
  <rect x="0" y="1640" width="1080" height="24" fill="#3a3354"/>
  <g id="dashes"></g>
 </svg>
 <div id="mono" class="abs"></div>
 <div id="phone" class="abs"><div id="ph-h">MIS LOGROS</div><div id="medals"></div><div id="cnt">47 MEDALLAS</div><div id="btn">CANJEAR</div></div>
 <div id="toast" class="abs">No disponible 🤷</div>
 <div id="zero" class="abs"><span>0 €<small>VALOR</small></span></div>
 <div id="mon" class="abs">
  <img id="coin" src="brand/moneda_moncu.png">
  <div id="mcount">0<small>MONCUS</small></div>
  <div id="rate"><span>5 KM = <b style="font-weight:400;color:#9C86F5">25</b> MONCUS</span></div>
  <div id="shoe"><div class="tag">GRATIS</div><img src="brand/prod_shoe.png"><div class="nm">ZAPATILLAS</div></div>
 </div>
 <div id="title" class="abs t"></div>
 <div id="end" class="abs"><div class="lg"><img src="brand/logo_cara.png"></div><div id="bio"><span>LINK EN LA BIO</span></div></div>
 <div id="flash" class="abs"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const NS='http://www.w3.org/2000/svg';
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
window.T={hook:0,ytu:1.83,feliz:2.49,canjea:3.78,press:4.45,spoil:5.73,nada:6.62,zap:8.2,km:10.11,vale:11.65,desc:13.52,bio:14.72,end:16.5};
const labs=['5K','10K','TOP','21K','RACHA','42K'];
const MD=labs.map((l,i)=>{const d=document.createElement('div');d.className='md';d.innerHTML=`<div class="rb"></div><div class="c">${l}</div>`;$('medals').appendChild(d);return d});
const DS=[];for(let i=0;i<12;i++)DS.push(el('rect',{x:0,y:1700,width:120,height:12,rx:6,fill:'#2A2440'},$('dashes')));
for(let i=0;i<24;i++){const a=i*15;el('path',{d:`M540 900 L${540+1600*Math.cos((a-3)*Math.PI/180)} ${900+1600*Math.sin((a-3)*Math.PI/180)} L${540+1600*Math.cos((a+3)*Math.PI/180)} ${900+1600*Math.sin((a+3)*Math.PI/180)} Z`,fill:'#7B5CF0',opacity:.07},$('rays'))}
for(let i=0;i<47;i++){const im=document.createElement('img');im.src='gif/m'+String(i).padStart(2,'0')+'.png';im.id='mf'+i;$('mono').appendChild(im)}
let lastF=-1,last='',D=0,lt=null;
function setTitle(h){if(h!==last){$('title').innerHTML=h;last=h}}
function render(t){
 const T=window.T;
 if(lt===null||t<lt){D=0;lastF=-1;document.querySelectorAll('#mono img').forEach(i=>i.style.display='none')}else D+=(t-lt)*(t>=T.zap?1.25:1);lt=t;
 DS.forEach((d,i)=>{const x=((i*200-D*950)%2400+2400)%2400-200;d.setAttribute('x',x)});
 const fr=Math.floor(D*24)%47;if(fr!==lastF){if(lastF>=0)$('mf'+lastF).style.display='none';$('mf'+fr).style.display='block';lastF=fr}
 $('mono').style.opacity=t<T.desc?1:0;
 // títulos
 const sc=[[T.hook,'Tu app te da<br>una <b>medalla</b>.'],[T.ytu,'Y tú, feliz<br>con tu <b>medallita</b>...'],[T.canjea,'¿Y esto dónde<br>se <b>canjea</b>?'],[T.spoil,'Spoiler...'],[T.nada,'...en <b>ningún</b><br>sitio.'],
  [T.zap,'Moncu te da<br><b>zapatillas</b>.'],[T.km,'Cada km<br>suma <b>Moncus</b>.'],[T.vale,'Tu esfuerzo<br><b>vale algo</b>.'],[T.desc,'Descarga<br><b>Moncu</b>.']];
 let ki=0;sc.forEach((s,i)=>{if(t>=s[0])ki=i});setTitle(sc[ki][1]);const s0=sc[ki][0];
 $('title').style.transform=`scale(${.5+.5*back((t-s0)/.25)}) rotate(${ki%2?1.5:-1.5}deg)`;
 // móvil con medallas
 const ph=t<T.zap;const out=ease((t-(T.zap-.25))/.35);
 $('phone').style.display=ph||out<1?'block':'none';
 $('phone').style.transform=`translateX(${-out*900}px) rotate(${-out*10 + (t>=T.press&&t<T.press+.4?Math.sin((t-T.press)*60)*2.5:0)}deg) scale(${.85+.15*back(t/.3)})`;
 MD.forEach((m,i)=>{const a=.15+i*.17;const q=t-a;m.style.opacity=q>0?1:0;m.style.transform=`scale(${q>0?back(q/.25):0})`;
  const grey=t>=T.spoil?clamp((t-T.spoil)/.4):0;m.style.filter=`grayscale(${grey}) brightness(${1-.5*grey})`});
 $('cnt').style.opacity=t>=T.feliz?1:0;$('cnt').textContent=Math.round(6+41*ease((t-T.feliz)/.8))+' MEDALLAS';
 $('btn').style.opacity=t>=T.canjea?1:0;
 const pr=t>=T.press&&t<T.press+.18;$('btn').style.transform=`scale(${t<T.canjea?0:pr?.92:back((t-T.canjea)/.25)})`;
 $('btn').style.background=t>=T.press+.18?'#3A3360':'#7B5CF0';$('btn').style.color=t>=T.press+.18?'#8E87A8':'#fff';
 const to=t>=T.press+.25&&t<T.spoil;$('toast').style.opacity=to?1:0;$('toast').style.transform=`translateY(${to?(1-back((t-T.press-.25)/.3))*60:0}px)`;
 const zo=t>=T.nada&&t<T.zap-.1;$('zero').style.opacity=zo?1:0;$('zero').style.transform=`scale(${zo?back((t-T.nada)/.3):0}) rotate(-6deg)`;
 // lado Moncu
 const mo=t>=T.zap-.1&&t<T.desc;const mi=ease((t-T.zap+.1)/.35);
 $('mon').style.opacity=mo?1:0;$('mon').style.transform=`translateX(${(1-mi)*900}px)`;
 $('rays').setAttribute('opacity',t>=T.zap?1:0);$('rays').setAttribute('transform',`rotate(${t*8} 540 900)`);
 const shoeOn=t>=T.zap+.2&&t<T.km;$('shoe').style.opacity=shoeOn?1:0;$('shoe').style.transform=`scale(${shoeOn?back((t-T.zap-.2)/.3):0}) rotate(-2deg)`;
 const cOn=t>=T.km;$('coin').style.opacity=cOn?1:0;$('coin').style.transform=`scale(${cOn?back((t-T.km)/.3):0}) rotate(${Math.sin(t*3)*6}deg)`;
 $('mcount').style.opacity=cOn?1:0;$('mcount').firstChild.textContent=Math.round(250*ease((t-T.km-.2)/1.6)).toLocaleString('es-ES');
 $('rate').style.opacity=t>=T.km+.5?1:0;$('rate').style.transform=`scale(${back((t-T.km-.5)/.3)})`;
 // cierre con el logo real
 const eo=t>=T.desc;$('end').style.opacity=eo?1:0;$('end').style.transform=`scale(${eo?back((t-T.desc)/.35):0})`;
 $('bio').style.opacity=clamp((t-T.bio)/.2);$('bio').style.transform=`scale(${back((t-T.bio)/.3)})`;
 $('flash').style.opacity=Math.max(clamp(1-Math.abs(t-T.zap)/.12),clamp(1-Math.abs(t-T.desc)/.1))*.18;
}
window.render=render;render(0);
</script></body></html>
