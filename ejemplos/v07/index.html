<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:A;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:P;src:url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:A,sans-serif;background:#0B0A12}
.abs{position:absolute}
.t{color:#FFFFFF;text-align:center;letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.6)}
#cam{left:0;top:0;width:1080px;height:1920px}
#title{left:40px;right:40px;top:300px;font-size:120px;line-height:1.04;z-index:20}
#title i{font-style:normal;color:#E5F38B}#title b{font-weight:400;color:#7B5CF0}
#title em{font-style:normal;display:inline-block;background:#E5F38B;color:#000;text-shadow:none;padding:4px 26px 10px;border-radius:20px}
#title small{display:block;font-size:84px;line-height:1.08;margin-top:22px}
#title q{quotes:none;font-family:P;font-size:70px;color:#E9E3FD}
#study{left:80px;right:80px;top:280px;z-index:19;background:#141414;border:3px solid #2c2840;border-radius:40px;padding:40px 50px;opacity:0}
.sn{font-size:150px;line-height:1;color:#7B5CF0}
.sl{font-family:P;font-size:44px;color:#A3A3A3;margin:4px 0 26px}
#chart{left:80px;right:80px;top:280px;z-index:19;background:#141414;border:3px solid #2c2840;border-radius:40px;padding:44px 50px 36px;opacity:0}
#chart h3{margin:0 0 30px;font-weight:400;font-size:60px;color:#fff;letter-spacing:2px}
.row{margin-bottom:34px}
.lab{display:flex;justify-content:space-between;font-size:64px;color:#fff;margin-bottom:12px}
.lab span:last-child{color:#A3A3A3}
.bar{height:56px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.fill{height:100%;border-radius:999px;background:#7B5CF0;width:100%}
#src{font-family:P;font-size:30px;color:#6f6890;margin-top:6px}
#tags{left:0;right:0;top:300px;z-index:19;text-align:center}
#tags .tg{display:inline-block;margin:10px;background:#141414;border:3px solid #2c2840;color:#fff;font-size:76px;padding:10px 36px 16px;border-radius:999px;opacity:0}
#tags .tg b{font-weight:400;color:#7B5CF0}
#tags .ex{border-color:#7B5CF0}
#tags .ex.on{background:#E5F38B;color:#000;border-color:#E5F38B}
#mono{left:250px;top:1110px;width:580px;height:580px;transform-origin:50% 95%}
#mono img{position:absolute;left:0;top:0;width:580px;height:580px;display:none}
#mark{left:0;right:0;top:1790px;text-align:center;z-index:30;font-size:40px;letter-spacing:8px;color:rgba(255,255,255,.5);opacity:0}
#vig{left:0;top:0;width:1080px;height:1920px;z-index:15;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);opacity:0}
#cover{left:0;top:0;width:1080px;height:1920px;z-index:60;display:none}
</style></head><body>
<div id="s">
 <div id="cam" class="abs">
 <svg class="abs" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0B0A12"/><stop offset=".55" stop-color="#1A1531"/><stop offset="1" stop-color="#2E2557"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#E9E3FD" stop-opacity=".3"/><stop offset="1" stop-color="#E9E3FD" stop-opacity="0"/></radialGradient></defs>
  <rect width="1080" height="1920" fill="url(#sg)"/>
  <g id="stars"></g><g id="far"></g><g id="park"></g>
  <rect x="0" y="1640" width="1080" height="24" fill="#3a3354"/>
  <rect x="0" y="1664" width="1080" height="900" fill="#17141F"/>
  <g id="tiles"></g>
 </svg>
 <div id="mono" class="abs"></div>
 </div>
 <div id="vig" class="abs"></div>
 <div id="title" class="abs t"></div>
 <div id="study" class="abs t"><div class="sn" id="sn1">25</div><div class="sl">estudios analizados</div><div class="sn" id="sn2">26.610</div><div class="sl" style="margin-bottom:0">deportistas</div></div>
 <div id="chart" class="abs"><h3>LESIONES</h3>
  <div class="row"><div class="lab"><span>ESTIRAR</span><span id="v1">100</span></div><div class="bar"><div class="fill" id="f1"></div></div></div>
  <div class="row"><div class="lab"><span>FUERZA</span><span id="v2">100</span></div><div class="bar"><div class="fill" id="f2"></div></div></div>
  <div id="src">Lauersen et al., BJSM 2014 · 25 estudios</div></div>
 <div id="tags" class="abs"><span class="tg" id="g1"><b>2</b> DÍAS / SEMANA</span><span class="tg" id="g2"><b>20</b> MIN</span><br><span class="tg ex" id="e1">SENTADILLAS</span><span class="tg ex" id="e2">ZANCADAS</span><span class="tg ex" id="e3">GEMELOS</span></div>
 <div id="mark" class="abs">MONCU</div>
 <img id="cover" class="abs" src="moncu_fuerza_PORTADA.png">
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const sd=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const NS='http://www.w3.org/2000/svg';
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
// Tiempos de cada frase (sincronizados con la voz)
window.T={hook:0,ya:2.67,mala:3.82,estudio:5.69,estirar:10.55,nada:11.48,fuerza:14.0,tercio:14.88,tercio2:16.84,osea:18.36,porque:20.78,juegas:22.33,ojo:24.4,nomalo:25.03,suelto:26.44,noprot:28.59,losi:29.92,dias:30.66,sent:32.98,zanc:33.86,gem:34.55,maq:35.27,rodillas:36.59,preg:40.16,teleo:42.38,end:44.4};
// --- parque de calistenia al anochecer: barras, paralelas, banco y farolas, en morados apagados
const ST=[];for(let i=0;i<40;i++)ST.push(el('circle',{cx:sd(i+50)*1080,cy:40+sd(i+90)*900,r:1.4+sd(i+7)*2,fill:'#E9E3FD'},$('stars')));
const FR=[];for(let i=0;i<8;i++){const g=el('g',{},$('far'));g._x=i*320;const h=160+sd(i)*140;
 el('circle',{cx:0,cy:1420-h*.5,r:90+sd(i+2)*40,fill:'#211B3D'},g);el('circle',{cx:80,cy:1440-h*.4,r:80,fill:'#211B3D'},g);el('rect',{x:-8,y:1400,width:16,height:240,fill:'#211B3D'},g);FR.push(g)}
const PK=[];const P=$('park');
function bars(x){const g=el('g',{},P);g._x=x;el('rect',{x:0,y:1250,width:20,height:390,fill:'#2E2756'},g);el('rect',{x:300,y:1250,width:20,height:390,fill:'#2E2756'},g);el('rect',{x:-6,y:1244,width:332,height:18,rx:9,fill:'#3D3470'},g);el('rect',{x:120,y:1340,width:12,height:300,fill:'#2E2756'},g);el('rect',{x:110,y:1334,width:200,height:14,rx:7,fill:'#3D3470'},g);return g}
function para(x){const g=el('g',{},P);g._x=x;[0,200].forEach(o=>{el('rect',{x:o,y:1480,width:14,height:160,fill:'#2E2756'},g)});el('rect',{x:-20,y:1474,width:254,height:14,rx:7,fill:'#3D3470'},g);el('rect',{x:-20,y:1510,width:254,height:12,rx:6,fill:'#352D63'},g);return g}
function lamp(x){const g=el('g',{},P);g._x=x;el('circle',{cx:0,cy:1210,r:110,fill:'url(#halo)'},g);el('rect',{x:-6,y:1215,width:12,height:425,fill:'#2C2550'},g);el('circle',{cx:0,cy:1210,r:13,fill:'#E9E3FD',opacity:.6},g);return g}
function bench(x){const g=el('g',{},P);g._x=x;el('rect',{x:0,y:1560,width:240,height:18,rx:6,fill:'#3D3470'},g);el('rect',{x:20,y:1578,width:14,height:62,fill:'#2E2756'},g);el('rect',{x:206,y:1578,width:14,height:62,fill:'#2E2756'},g);return g}
PK.push(bars(0),lamp(520),para(760),bench(1150),lamp(1500),bars(1760),para(2200));
const TL=[];for(let i=0;i<16;i++)TL.push(el('rect',{x:0,y:1700,width:110,height:8,rx:4,fill:'#2A2440'},$('tiles')));
for(let i=0;i<47;i++){const im=document.createElement('img');im.src='gif/m'+String(i).padStart(2,'0')+'.png';im.id='mf'+i;$('mono').appendChild(im)}
let lastF=-1,last='',D=0,PH=0,lt=null;
function setTitle(h){if(h!==last){$('title').innerHTML=h;last=h}}
// cámara: [tiempo, zoom, origenX, origenY]
function cam(t){const T=window.T;
 const keys=[[0,1.9,560,1330],[T.ya,2.7,640,1210],[T.estudio,1.0,540,1300],[T.osea,1.25,540,1350],[T.ojo,1.0,540,1300],[T.losi,1.45,540,1380],[T.rodillas,1.0,540,1300],[T.preg,1.15,540,1330]];
 let k=0;keys.forEach((q,i)=>{if(t>=q[0])k=i});
 const a=keys[Math.max(0,k-1)],b=keys[k];const u=k===0?1:sm((t-b[0])/.6);
 return [a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u,a[3]+(b[3]-a[3])*u]}
function render(t){
 const T=window.T;
 const frz=t>=T.losi&&t<T.rodillas;          // el mono se para: momento ejercicios
 const sp=frz?Math.max(0,1-(t-T.losi)/.4):(t>=T.rodillas?clamp((t-T.rodillas)/.4):1);
 if(lt===null||t<lt){D=0;PH=0;lastF=-1;document.querySelectorAll('#mono img').forEach(i=>i.style.display='none')}else{D+=sp*(t-lt);PH+=sp*(t-lt)}lt=t;
 ST.forEach((c,i)=>c.setAttribute('opacity',(.1+.25*(.5+.5*Math.sin(t*(.8+sd(i)*1.6)+i))).toFixed(3)));
 FR.forEach(b=>{const x=((b._x-D*140)%2560+2560)%2560-200;b.setAttribute('transform',`translate(${x},0)`)});
 PK.forEach(b=>{const x=((b._x-D*520)%2600+2600)%2600-400;b.setAttribute('transform',`translate(${x},0)`)});
 TL.forEach((d,i)=>{const x=((i*180-D*900)%2880+2880)%2880-200;d.setAttribute('x',x)});
 // mono: corre; en los ejercicios se congela en la zancada más amplia y baja/sube despacio
 let fr=Math.floor(PH*24)%47; if(frz&&sp===0){fr=0}
 if(fr!==lastF){if(lastF>=0)$('mf'+lastF).style.display='none';$('mf'+fr).style.display='block';lastF=fr}
 const dip=frz&&sp===0?(.5-.5*Math.cos((t-T.losi-.4)*Math.PI*1.2))*40:0;
 $('mono').style.transform=`translateY(${dip}px)`;
 // cámara
 const [z,ox,oy]=cam(t);$('cam').style.transformOrigin=`${ox}px ${oy}px`;$('cam').style.transform=`scale(${z})`;
 $('vig').style.opacity=clamp((z-1)/.8);
 // títulos
 const sc=[[T.hook,'<em>¿Estiras antes<br>de correr?</em><small>...para no lesionarte</small>'],[T.ya,'Ya...'],[T.mala,'Tengo una<br><i>mala noticia</i>.'],[T.estudio,''],
  [T.osea,'El día que te saltas<br>el <i>gimnasio</i>...'],[T.porque,'El día que te saltas<br>el <i>gimnasio</i>...<br><q>“porque yo soy de correr”</q>'],[T.juegas,'...es justo el que<br>más <i>te la juegas</i>.'],
  [T.ojo,'Ojo.'],[T.nomalo,'Estirar<br><i>no es malo</i>.'],[T.suelto,'Estirar<br><i>no es malo</i>.<small>Te deja suelto y sienta genial.</small>'],[T.noprot,'Pero<br><i>no te protege</i>.'],[T.losi,''],
  [T.rodillas,'Tus <i>rodillas</i><br>te lo van a<br>agradecer.'],[T.preg,'¿Tú eres de<br><b>estirar</b> o de<br>hacer <i>fuerza</i>?'],[T.teleo,'¿Tú eres de<br><b>estirar</b> o de<br>hacer <i>fuerza</i>?<small>Te leo 👇</small>']];
 let ki=0;sc.forEach((s,i)=>{if(t>=s[0])ki=i});setTitle(sc[ki][1]);const s0=sc[ki][0];
 const soft=[T.porque,T.suelto,T.teleo].includes(s0);
 $('title').style.transform=`scale(${soft?1:.55+.45*back((t-s0)/.3)}) rotate(${ki%2?1.5:-1.5}deg)`;
 // estudio
 const so=t>=T.estudio&&t<T.estirar;const sq=t-T.estudio;$('study').style.opacity=so?1:0;$('study').style.transform=`scale(${so?.7+.3*back(sq/.35):0})`;
 $('sn1').textContent=Math.round(25*ease((t-T.estudio-.3)/1.2));
 $('sn2').textContent=Math.round(26610*ease((t-T.estudio-1.2)/1.8)).toLocaleString('es-ES');
 // gráfica
 const co=t>=T.estirar&&t<T.osea;const cq=t-T.estirar;$('chart').style.opacity=co?1:0;$('chart').style.transform=`scale(${co?.7+.3*back(cq/.35):0})`;
 const v1=100-4*ease((t-T.nada)/1.0), v2=100-69*ease((t-T.tercio)/1.2);
 $('f1').style.width=v1+'%';$('f2').style.width=v2+'%';$('v1').textContent=Math.round(v1);
 $('v2').textContent=t>=T.tercio2?'MENOS DE 1/3':Math.round(v2);$('v2').style.color=t>=T.tercio?'#E5F38B':'#A3A3A3';
 $('f2').style.background=t>=T.tercio?'#E5F38B':'#7B5CF0';
 $('chart').style.transform+=` translateY(${t>=T.tercio2?Math.sin((t-T.tercio2)*20)*clamp(1-(t-T.tercio2)/.5)*6:0}px)`;
 // etiquetas de ejercicios
 const tg=t>=T.losi&&t<T.rodillas;
 [['g1',T.dias],['g2',T.dias+.6],['e1',T.sent],['e2',T.zanc],['e3',T.gem]].forEach(([id,a])=>{const e=$(id);const q=t-a;const on=tg&&q>0;e.style.opacity=on?1:0;e.style.transform=`scale(${on?back(q/.3):0})`});
 [['e1',T.sent,T.zanc],['e2',T.zanc,T.gem],['e3',T.gem,T.maq]].forEach(([id,a,b])=>$(id).classList.toggle('on',t>=a&&t<b));
 $('tags').style.top=t>=T.maq?'260px':'300px';
 if(t>=T.maq&&tg){if(!$('mq')){const d=document.createElement('div');d.id='mq';d.className='t';d.style.cssText='font-size:96px;margin-top:30px;color:#fff';d.innerHTML='Sin <span style="color:#E5F38B">máquinas raras</span>.';$('tags').appendChild(d)}$('mq').style.opacity=clamp((t-T.maq)/.2)}else if($('mq'))$('mq').style.opacity=0;
 $('mark').style.opacity=clamp((t-T.preg-.5)/.5)*.9;
 $('cover').style.display=t<1/30?'block':'none';
}
window.render=render;render(0);
</script></body></html>
